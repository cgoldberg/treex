[package]
name = "treex-native"
version = "0.2.1"
edition = "2024"

[lib]
name = "_native"
path = "rust/lib.rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py313"] }
gix = { version = "0.89", default-features = false, features = ["excludes", "index", "sha1"] }
