[package]
name = "treex-native"
version = "0.1.13-dev.1"
edition = "2024"

[lib]
name = "_native"
path = "rust/lib.rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"] }
gix = { version = "0.89", default-features = false, features = ["excludes", "index", "sha1"] }
