# Tox configuration - environment and task orchestrator
#
# Environments are isolated and managed by uv using uv.lock.
#
# Run "tox" from this directory.
#
# Run a specific environment with:
#   "tox -e <env>" (e.g. "tox -e lint")


[tox]
requires = tox-uv
venv_redirect = false
envlist =
    validate
    lint
    py313
    py314
    py315
stop_on_first_error = true


[testenv]
description = Run tests
runner = uv-venv-lock-runner
dependency_groups = test
commands =
    pytest {tty:--color=yes} {posargs:.}


[testenv:validate]
description = Validate project configuration
dependency_groups = validate
commands =
    uv lock --check
    validate-pyproject pyproject.toml
    python -c "import treex.treex"
    treex --help


[testenv:lint]
description = Run linter and formatter
dependency_groups = lint
package = skip
commands =
    ruff check --fix --show-fixes --exit-non-zero-on-fix src tests
    ruff format --exit-non-zero-on-format src tests


[testenv:lock]
description = Update dependency lockfile
runner = uv-venv-runner
package = skip
commands = uv lock --upgrade


[testenv:build]
description = Build sdist and local wheel
package = skip
dependency_groups = build
commands =
    uv build


[testenv:wheels]
description = Build portable wheels for supported platforms
package = skip
dependency_groups = build
commands =
    cibuildwheel


[testenv:check-dist]
description = Validate release distribution artifacts
package = skip
dependency_groups = build
commands =
    python -m twine check dist/*
