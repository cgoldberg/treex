# Tox configuration - environment and task orchestrator
#
# Environments are isolated and managed by uv using uv.lock.
#
# Run "tox" from this directory.
#
# Run a specific environment with:
#   "tox -e <env>" (e.g. "tox -e lint")


[tox]
requires = tox-uv
venv_redirect = false
env_list =
    lint
    validate
    py313
    py315


[testenv]
description = Run tests
runner = uv-venv-lock-runner
base_python = python3.13
dependency_groups = test
fail_fast = true
pass_env = *
commands =
    pytest {tty:--color=yes} {posargs:.}


[testenv:lint]
description = Run linter and formatter
dependency_groups = lint
package = skip
commands =
    ruff check --fix --show-fixes --exit-non-zero-on-fix src tests
    ruff format --exit-non-zero-on-format src tests


[testenv:validate]
description = Validate build and project configuration
dependency_groups = validate
commands =
    uv lock --check
    validate-pyproject pyproject.toml
    {env_python} -c "import treex.treex"
    treex --help


[testenv:py313]
base_python = python3.13


[testenv:py314]
base_python = python3.14


[testenv:py315]
base_python = python3.15


[testenv:lock]
description = Update dependency lockfile
runner = uv-venv-runner
package = skip
commands = uv lock --upgrade


[testenv:sdist]
description = Build source distribution
package = skip
dependency_groups = build
commands =
    python -c "import shutil; shutil.rmtree(r'{tox_root}/dist', ignore_errors=True)"
    uv build --sdist
    {env_python} -m twine check dist/*


[testenv:wheel]
description = Build generic wheel
package = skip
dependency_groups = build
commands =
    python -c "import shutil; shutil.rmtree(r'{tox_root}/dist', ignore_errors=True)"
    uv build --wheel
    {env_python} -m twine check dist/*


[testenv:wheel-dist]
description = Build and test distributable wheel variants
package = skip
dependency_groups = build
commands =
    python -c "import shutil; shutil.rmtree(r'{tox_root}/wheelhouse', ignore_errors=True)"
    cibuildwheel
    {env_python} -m twine check wheelhouse/*


[testenv:check-dist]
description = Validate built distributions
package = skip
depends =
    build
    wheel
dependency_groups = build
commands =
    {env_python} -m twine check dist/*
