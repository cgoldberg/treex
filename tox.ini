# Tox configuration - environment and task orchestrator
#
# Environments are isolated and managed by uv using uv.lock.
#
# Run "tox" from this directory.
#
# Run a specific environment with:
#   "tox -e <env>" (e.g. "tox -e lint")


[tox]
requires =
    tox==4.67.1
    tox-uv==1.37.0
venv_redirect = false
env_list =
    lint
    validate
    py313
    py315
skip_missing_interpreters = true


[testenv]
runner = uv-venv-lock-runner
base_python = python3.13
fail_fast = true
pass_env = *
dependency_groups = test
commands =
    pytest {tty:--color=yes} {posargs:.}


[testenv:py313]
description = Run tests with Python 3.13
base_python = python3.13


[testenv:py314]
description = Run tests with Python 3.14
base_python = python3.14


[testenv:py315]
description = Run tests with Python 3.15
base_python = python3.15


[testenv:lint]
description = Run linting and formatting
package = skip
dependency_groups = lint
commands =
    ruff check --fix --show-fixes --exit-non-zero-on-fix src tests scripts
    ruff format --exit-non-zero-on-format src tests scripts


[testenv:validate]
description = Validate build and project configuration
dependency_groups = validate
commands =
    uv lock --check
    validate-pyproject pyproject.toml
    {env_python} -c "import treex.treex"
    treex --help


[testenv:lock]
description = Update dependency lockfiles
runner = uv-venv-runner
package = skip
allowlist_externals = cargo
commands =
    {envpython} {toxinidir}/scripts/update_cargo_version.py
    uv lock --upgrade
    cargo update --verbose


[testenv:sdist]
description = Build source distribution
package = skip
dependency_groups = build
commands =
    {env_python} -c "import shutil; shutil.rmtree(r'{tox_root}/dist', ignore_errors=True)"
    uv build --sdist
    {env_python} -m twine check --strict dist/*


[testenv:wheel]
description = Build generic wheel
package = skip
dependency_groups = build
commands =
    {env_python} -c "import shutil; shutil.rmtree(r'{tox_root}/dist', ignore_errors=True)"
    uv build --wheel
    {env_python} -m twine check --strict dist/*


[testenv:check-dist]
description = Validate built distributions
package = skip
depends =
    sdist
    wheel
commands =
    {env_python} -m twine check --strict dist/*


[testenv:wheel-dist]
description = Build and test distributable wheel variants
package = skip
dependency_groups = build
commands =
    {env_python} -c "import shutil; shutil.rmtree(r'{tox_root}/wheelhouse', ignore_errors=True)"
    cibuildwheel
    {env_python} -m twine check --strict wheelhouse/*
