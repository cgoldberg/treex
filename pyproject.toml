[build-system]
requires = ["setuptools", "setuptools-rust"]
build-backend = "setuptools.build_meta"

[project]
name = "treex-cli"
version = "0.2.5.dev0"
description="Command-line directory tree utility with metadata and Git ignore support"
requires-python = ">= 3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Corey Goldberg"}]
maintainers = [{name = "Corey Goldberg"}]
readme = "README.md"
keywords = [
    "tree", "cli", "directories", "files",
    "git", "gitignore", "gitoxide", "metadata",
    "python", "rust",
]
classifiers = [
        "Environment :: Console",
        "Operating System :: OS Independent",
        "Programming Language :: Python",
        "Programming Language :: Python :: 3",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3.14",
        "Programming Language :: Python :: 3.15",
        "Programming Language :: Rust",
]

[project.scripts]
treex = "treex.treex:main"

[project.urls]
homepage = "https://github.com/cgoldberg/treex"
repository = "https://github.com/cgoldberg/treex"

[dependency-groups]
build = [
    "cibuildwheel==4.3.5",
    "twine==7.0.0",
]
lint = [
    "ruff==0.17.3",
]
test = [
    "pytest==9.2.0",
]
validate = [
    "validate-pyproject[all]==0.27",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[[tool.setuptools-rust.ext-modules]]
target = "treex._native"
path = "Cargo.toml"
binding = "PyO3"
py-limited-api = true

[tool.cibuildwheel]
build = "cp313-*"
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }
test-requires = ["pytest==9.2.0"]
test-command = "pytest {project}"

[tool.pytest]
addopts = ["-v"]
filterwarnings = ["default"]
testpaths = ["tests"]
tmp_path_retention_policy = "none"

[tool.ruff]
line-length = 88
respect-gitignore = true
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN", "C901", "COM812", "D", "DTZ",
    "EM101", "FBT", "PLR", "S603",
    "S607", "T201", "TRY003"
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["INP001", "S101", "S108", "SLF001"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88
