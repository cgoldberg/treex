name: tests

on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
            toxenv: py313
          - os: ubuntu-latest
            python-version: "3.14"
            toxenv: py314
          - os: ubuntu-latest
            python-version: "3.15"
            toxenv: py315
          - os: windows-latest
            python-version: "3.13"
            toxenv: py313
          - os: windows-latest
            python-version: "3.14"
            toxenv: py314
          - os: windows-latest
            python-version: "3.15"
            toxenv: py315
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          check-latest: true
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip tox
      - name: Validate build and project configuration
        run: tox
        env:
          TOXENV: validate
      - name: Run linting and formatting
        if: matrix.os == 'ubuntu-latest'
        run: tox
        env:
          TOXENV: lint
      - name: Run tests
        run: tox
        env:
          TOXENV: ${{ matrix.toxenv }}
