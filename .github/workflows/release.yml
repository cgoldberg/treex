name: release

on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: read

jobs:
  wheels:
    name: Wheels (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-14
          - name: windows-x86_64
            os: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install tox
        run: python -m pip install tox

      - name: Build wheels
        run: tox -e wheels

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install tox
        run: python -m pip install tox

      - name: Build sdist
        run: tox -e build

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Validate and publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install tox
        run: python -m pip install tox

      - name: Download all distributions
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - name: Validate distributions
        run: tox -e check-dist

      - name: Validate distributions
        run: tox -e release

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          with open("pyproject.toml", "rb") as f:
              project = tomllib.load(f)
          package_version = project["project"]["version"]
          tag_version = os.environ["RELEASE_TAG"]
          print(f"Git tag version: {tag_version}")
          print(f"Package version: {package_version}")
          if tag_version != package_version:
              raise SystemExit("Git tag does not match package version")
          print("Version check passed.")
          PY
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
